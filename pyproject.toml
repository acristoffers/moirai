[project]
name = "moirai"
version = "1.3.32"
description = "Digital Control Manager Backend"
authors = [{ name = "Álan Crístoffer", email = "acristoffers@startmail.com" }]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
keywords = ["digital control manager"]
dependencies = [
    "Flask>=3.1.3",
    "ahio~=1.0.35",
    "appdirs>=1.4.4",
    "cheroot>=11.0.0",
    "mysql-connector-python>=9.1.0",
    "numpy>=2.0.0",
    "pymongo>=4.16.0",
    "python-dateutil>=2.9.0",
    "scipy>=1.13.1",
]

[project.urls]
Repository = "https://github.com/acristoffers/moirai"

[project.scripts]
moirai = "moirai.moirai:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
